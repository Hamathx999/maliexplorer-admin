<div class="login-page">
  <div class="login-card">
    <!-- Logo & Header -->
    <div class="brand-header">
      <div class="logo-box">
        <img src="/assets/MaliExplorer.png" alt="MaliExplorer" class="logo-img" />
      </div>
      <h1 class="brand-title">MaliExplorer</h1>
      <p class="brand-subtitle">Connectez-vous pour gérer les merveilles, monuments et données du Mali</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      <p>{{ errorMessage }}</p>
    </div>
    <div *ngIf="successMessage" class="alert alert-success">
      <p>{{ successMessage }}</p>
    </div>

    <!-- TAB 2: Connexion par Email & Mot de passe -->
    <div class="form-body">
      <div class="field-group">
        <label for="emailInput">Adresse e-mail administrateur</label>
        <input
          id="emailInput"
          type="email"
          [(ngModel)]="emailInput"
          placeholder="admin@maliexplorer.ml"
          class="form-control"
        />
      </div>

      <div class="field-group">
        <label for="pwdInput">Mot de passe </label>
        <input
          id="pwdInput"
          type="password"
          [(ngModel)]="passwordInput"
          placeholder="••••••••••••"
          class="form-control"
          (keyup.enter)="loginWithCredentials()"
        />
      </div>

      <button
        type="button"
        class="btn-submit"
        (click)="loginWithCredentials()"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading" class="spinner-row">Connexion en cours...</span>
      </button>
    </div>
  </div>
</div>
